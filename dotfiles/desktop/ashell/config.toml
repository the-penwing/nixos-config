log_level = "warn"
outputs = "All"
position = "Top"
layer = "Top"
enable_esc_key = true

[modules]
left = [["appLauncher", "Workspaces"]]
center = ["WindowTitle"]
right = ["SystemInfo", "MediaPlayer", ["Tray", "Tempo", "Privacy", "Settings"]]

[workspaces]
visibility_mode = "All"
group_by_monitor = false
enable_workspace_filling = false

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "fuzzel"

[window_title]
mode = "Title"
truncate_title_after_length = 150

[system_info]
indicators = ["Cpu", "Memory", "Temperature"]
interval = 5

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[media_player]
max_title_length = 100
indicator_format = "IconAndTitle"

[tempo]
clock_format = "%a %d %b %R"
weather_indicator = "IconAndTemperature"

[notifications]
format = "%H:%M"
show_timestamps = true
show_bodies = true

[settings]
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
shutdown_cmd = "shutdown now"
suspend_cmd = "systemctl suspend"
hibernate_cmd = "systemctl hibernate"
reboot_cmd = "systemctl reboot"
logout_cmd = "loginctl kill-user $(whoami)"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"
battery_format = "IconAndPercentage"
peripheral_battery_format = "Icon"
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
brightness_indicator_format = "Icon"
volume_step = 5
max_volume = 100
remove_airplane_btn = false
remove_idle_btn = false
indicators = [
  "IdleInhibitor",
  "Audio",
  "Microphone",
  "Bluetooth",
  "Network",
  "Vpn",
  "Battery",
  "Brightness",
]

[osd]
enabled = false
timeout = 1500
show_volume_percentage = true
show_brightness_percentage = true

[animations]
enabled = true

[appearance]
style = "Islands"
scale_factor = 1
opacity = 0.5
primary_color = "#bd93f9"
success_color = "#50fa7b"
warning_color = "#f1fa8c"
danger_color = "#ff5555"
text_color = "#c1c4d6"
workspace_colors = ["#bd93f9", "#ff79c6"]
# special_workspace_colors = [ "#8be9fd", "#ffb86c" ]  # (default: None, falls back to workspace_colors)

[appearance.menu]
# opacity = 1.0   # (default) menu background opacity
# backdrop = 0.0   # (default) backdrop blur amount

[appearance.background_color]
base = "#282a36"
weak = "#21222c"
strong = "#44475a"
# weakest = "#191a21"
# weaker = "#1e1f29"
# neutral = "#6272a4"
# stronger = "#6272a4"
# strongest = "#f8f8f2"
