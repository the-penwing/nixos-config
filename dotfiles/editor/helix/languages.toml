# ========================================================================
# Language Servers Configuration
# ========================================================================
[language-server]
bash-language-server = { command = "bash-language-server", args = ["start"] }
kotlin-language-server = { command = "kotlin-language-server" }
lua-language-server = { command = "lua-language-server" }
nil = { command = "nil" }
nixd = { command = "nixd" }
pyright = { command = "pyright-langserver", args = ["--stdio"] }
ruff = { command = "ruff", args = ["server"] }
rust-analyzer = { command = "rust-analyzer" }
zls = { command = "zls" }
yaml-language-server = { command = "yaml-language-server", args = ["--stdio"] }
marksman = { command = "marksman", args = ["server"] }

clangd = { command = "sh", args = [
  "-c",
  "exec clangd --query-driver=/run/current-system/sw/bin/gcc,/run/current-system/sw/bin/clang",
] }
# Modern Web Stack LSPs
typescript-language-server = { command = "typescript-language-server", args = [
  "--stdio",
] }
tailwindcss-language-server = { command = "tailwindcss-language-server", args = [
  "--stdio",
] }
vscode-html-language-server = { command = "vscode-html-language-server", args = [
  "--stdio",
] }
vscode-css-language-server = { command = "vscode-css-language-server", args = [
  "--stdio",
] }
vscode-json-language-server = { command = "vscode-json-language-server", args = [
  "--stdio",
] }

# ========================================================================
# Language Configurations
# ========================================================================

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]
formatter = { command = "rustfmt" }
auto-format = true

[[language]]
name = "c"
language-servers = ["clangd"]
formatter = { command = "clang-format" }
auto-format = true

[[language]]
name = "cpp"
language-servers = ["clangd"]
formatter = { command = "clang-format" }
auto-format = true

[[language]]
name = "kotlin"
language-servers = ["kotlin-language-server"]
formatter = { command = "ktlint", args = ["-"] }
auto-format = true

[[language]]
name = "lua"
language-servers = ["lua-language-server"]
formatter = { command = "stylua", args = ["-"] }
auto-format = true

[[language]]
name = "nix"
language-servers = ["nil", "nixd"]
formatter = { command = "alejandra" }
auto-format = true

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
formatter = { command = "black", args = ["-"] }
auto-format = true

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
formatter = { command = "shfmt" }
auto-format = true

[[language]]
name = "zig"
language-servers = ["zls"]
formatter = { command = "zig", args = ["fmt", "--stdin"] }
auto-format = true

# --- Web & Frontend Stack ---

[[language]]
name = "html"
language-servers = [
  "vscode-html-language-server",
  "tailwindcss-language-server",
]
formatter = { command = "prettier", args = ["--parser", "html"] }
auto-format = true

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-language-server"]
formatter = { command = "prettier", args = ["--parser", "css"] }
auto-format = true

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--parser", "json"] }
auto-format = true

[[language]]
name = "jsonc"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--parser", "json"] }
auto-format = true

[[language]]
name = "javascript"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--parser", "babel"] }
auto-format = true

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "tailwindcss-language-server"]
formatter = { command = "prettier", args = ["--parser", "babel"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "tailwindcss-language-server"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

# --- Serialization & Docs ---

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["format", "-"] }
auto-format = true

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
formatter = { command = "yamlfmt", args = ["-"] }
auto-format = true

[[language]]
name = "markdown"
language-servers = ["marksman"]

[[language]]
name = "dockerfile"
file-types = ["Dockerfile", "dockerfile"]
