"$schema" = "https://starship.rs/config-schema.json"
palette = "dracula"
add_newline = true

format = '''
[┌─╼](yellow)$directory$git_branch$git_status
[├─╼](yellow)$username$hostname$nix_shell$rust$lua$python
$character'''

[palettes.dracula]
# Backgrounds and Foregrounds
background = "#282a36"

# Light shades for text
light1 = "#f8f8f2"
light2 = "#e0e0e0"
light3 = "#c0c0c0"
light4 = "#6272a4"

# Neutral Colours
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
purple = "#bd93f9"
aqua = "#8be9fd"
orange = "#ffb86c"

[directory]
style = "fg1"
format = '\[[$path]($style)\]'
truncate_to_repo = true
truncation_length = 3
fish_style_pwd_dir_length = 1

[username]
style_user = "green"
style_root = "red"
format = '\[[$user]($style)'
disabled = false
show_always = true

[hostname]
ssh_only = false
style = "aqua"
format = '[@$hostname]($style)\]'
disabled = false

[character]
success_symbol = "[└────╼](yellow)"
error_symbol = "[└╼](orange)"

[git_branch]
style = "yellow"
format = '\[[$symbol$branch](yellow)\](yellow)'
symbol = ""

[git_status]
use_git_executable = true
style = "fg1"
format = '([\[$all_status$ahead_behind\]]($style))'
ahead = "[⇡$count](blue)"
behind = "[⇣$count](blue)"
diverged = "[⇡$ahead_count⇣$behind_count](blue)"
modified = "[*](orange)"
staged = "[+](green)"
untracked = "[?](orange)"
deleted = "[✘](red)"
conflicted = "[~](red)"

[rust]
format = '\[[${symbol}${version}]($style)\]'
style = "orange"
symbol = " "

[python]
format = '\[[${symbol}${version}( \($virtualenv\))]($style)\]'
symbol = "󰌠 "
style = "yellow"

[lua]
format = '\[[${symbol}${version}]($style)\]'
symbol = " "
style = "blue"

[nix_shell]
format = '\[[${symbol}${name}${impure_msg}${pure_msg}${unknown_msg}\]](aqua)'
symbol = "󱄅 "
impure_msg = "[ impure](red)"
pure_msg = "[ pure](green)"
unknown_msg = "[ unknown](yellow)"
